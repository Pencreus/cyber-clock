# Cyber Clock - real firmware: Pencreus boot splash, big stacked clock (Pacific, auto DST) over Matrix rain.
# Panel wiring/driver verified on hardware via cyber-clock-bringup.yaml (2026-10-29).
#
# Compile:  esphome compile cyber-clock.yaml
# First flash over USB, then OTA:  esphome upload cyber-clock.yaml --device cyber-clock.local
# Bring-up/test patterns:          cyber-clock-bringup.yaml

esphome:
  name: cyber-clock
  friendly_name: Cyber Clock

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

# reboot_timeout 0 = never. Default (15min) reboots the clock whenever no Home Assistant / API client is connected.
api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key

# Logs the reset reason on every boot, so a future unexpected reboot can be identified.
debug:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Cyber Clock Fallback"
    password: !secret ap_password

# Real timezone database -> US daylight saving switches automatically.
time:
  - platform: sntp
    id: local_time
    timezone: America/Los_Angeles
    servers:
      - pool.ntp.org
      - time.cloudflare.com

# ---------------------------------------------------------------- controls (all show up in Home Assistant)
select:
  - platform: template
    name: "Display Mode"
    id: display_mode
    options: ["Clock + Rain", "Rain Only", "Clock Only"]
    initial_option: "Clock + Rain"
    optimistic: true
    restore_value: true

  - platform: template
    name: "Rain Color"
    id: rain_color
    options: ["Rainbow", "Matrix Green", "Cyan", "Amber", "Purple", "Red", "White"]
    initial_option: "Rainbow"
    optimistic: true
    restore_value: true

  - platform: template
    name: "Clock Color"
    id: clock_color
    options: ["White", "Cyan", "Matrix Green", "Amber", "Gold", "Magenta"]
    initial_option: "White"
    optimistic: true
    restore_value: true

number:
  - platform: template
    name: "Rain Speed"
    id: rain_speed
    min_value: 0.2
    max_value: 3.0
    step: 0.1
    initial_value: 1.0
    optimistic: true
    restore_value: true

  - platform: template
    name: "Rain Density"
    id: rain_density
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 5
    initial_value: 70
    optimistic: true
    restore_value: true

  - platform: template
    name: "Rain Trail Length"
    id: rain_trail
    min_value: 4
    max_value: 28
    step: 1
    initial_value: 14
    optimistic: true
    restore_value: true

  - platform: template
    name: "Brightness"
    id: panel_brightness
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 40
    optimistic: true
    restore_value: true
    on_value:
      - if:
          condition:
            switch.is_off: auto_brightness
          then:
            - hub75.set_brightness:
                id: matrix
                brightness: !lambda "return (int) x;"

  # Auto-brightness calibration (LDR voltage -> brightness). Defaults are GUESSES: calibrate by watching "Light Level".
  - platform: template
    name: "Auto Min Brightness"
    id: auto_min
    entity_category: config
    min_value: 1
    max_value: 255
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true
  - platform: template
    name: "Auto Max Brightness"
    id: auto_max
    entity_category: config
    min_value: 1
    max_value: 255
    step: 1
    initial_value: 120
    optimistic: true
    restore_value: true
  - platform: template
    name: "Light Dark Voltage"
    id: ldr_dark_v
    entity_category: config
    unit_of_measurement: "V"
    min_value: 0
    max_value: 3.3
    step: 0.05
    initial_value: 0.25
    optimistic: true
    restore_value: true
  - platform: template
    name: "Light Bright Voltage"
    id: ldr_bright_v
    entity_category: config
    unit_of_measurement: "V"
    min_value: 0
    max_value: 3.3
    step: 0.05
    initial_value: 1.5
    optimistic: true
    restore_value: true

switch:
  - platform: template
    name: "24-Hour Clock"
    id: clock_24h
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # Default OFF until the light-sensor mapping above is calibrated.
  - platform: template
    name: "Auto Brightness"
    id: auto_brightness
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_off_action:
      - hub75.set_brightness:
          id: matrix
          brightness: !lambda "return (int) id(panel_brightness).state;"

# Button U2 on the adapter board: GPIO32, internal pull-up, active LOW. Short press = next display mode.
binary_sensor:
  - platform: gpio
    id: mode_button
    name: "Mode Button"
    pin:
      number: GPIO32
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
    on_press:
      - lambda: |-
          id(display_mode).make_call().select_next(true).perform();

sensor:
  # No DHT11 is physically fitted on this board (header empty); harmless if left, add the part later for temperature.
  - platform: dht
    pin: GPIO33
    model: DHT11
    update_interval: 60s
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"

  - platform: adc
    id: ldr
    pin: GPIO35
    name: "Light Level"
    attenuation: 12db
    update_interval: 2s
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

interval:
  - interval: 2s
    then:
      - if:
          condition:
            switch.is_on: auto_brightness
          then:
            - hub75.set_brightness:
                id: matrix
                brightness: !lambda |-
                  float v = id(ldr).state;
                  if (isnan(v)) return (int) id(panel_brightness).state;
                  float lo = id(ldr_dark_v).state, hi = id(ldr_bright_v).state;
                  float f = (hi > lo) ? (v - lo) / (hi - lo) : 0.0f;
                  f = f < 0 ? 0 : (f > 1 ? 1 : f);
                  return (int) (id(auto_min).state + f * (id(auto_max).state - id(auto_min).state));

# ---------------------------------------------------------------- panel
display:
  - platform: hub75
    id: matrix
    panel_width: 64
    panel_height: 64
    r1_pin: GPIO25
    g1_pin: GPIO26
    b1_pin: GPIO27
    r2_pin: GPIO14
    g2_pin: GPIO12
    b2_pin: GPIO13
    a_pin: GPIO23
    b_pin: GPIO19
    c_pin: GPIO5
    d_pin: GPIO17
    e_pin: GPIO18
    lat_pin: GPIO4
    oe_pin: GPIO15
    clk_pin: GPIO16
    scan_wiring: STANDARD_TWO_SCAN
    shift_driver: GENERIC
    clock_speed: 10MHZ
    bit_depth: 6
    gamma_correct: CIE1931
    double_buffer: true
    brightness: 40
    update_interval: 40ms
    lambda: |-
      const int W = 64, H = 64;
      const uint32_t now_ms = millis();
      it.fill(Color(0, 0, 0));

      // hue 0..360 -> RGB
      auto hue = [](float h) -> Color {
        float x = fmodf(h, 360.0f) / 60.0f;
        float f = x - floorf(x);
        uint8_t q = 255 * (1.0f - f), t = 255 * f;
        switch ((int) x) {
          case 0: return Color(255, t, 0);
          case 1: return Color(q, 255, 0);
          case 2: return Color(0, 255, t);
          case 3: return Color(0, q, 255);
          case 4: return Color(t, 0, 255);
          default: return Color(255, 0, q);
        }
      };

      // ============ PENCREUS BOOT SPLASH (first ~5.5 s after every boot) ============
      // 64x64 redraw of the sunstone: gold ring, 20 blocks lighting clockwise, eye opens, glances, blinks.
      if (now_ms < 5500) {
        const float t = now_ms / 1000.0f;
        const float fade = t > 5.0f ? 1.0f - (t - 5.0f) / 0.5f : 1.0f;
        auto C = [&](int r, int g, int b) -> Color { return Color(r * fade, g * fade, b * fade); };
        const float cx = 31.5f, cy = 31.5f;
        // gold outer ring + dotted gold ring
        for (int a = 0; a < 360; a += 2) {
          float rad = a * 0.0174533f;
          it.draw_pixel_at(cx + 30.0f * cosf(rad), cy + 30.0f * sinf(rad), C(242, 193, 78));
          if (a % 6 == 0) it.draw_pixel_at(cx + 20.0f * cosf(rad), cy + 20.0f * sinf(rad), C(242, 193, 78));
        }
        // 20 blocks fill clockwise from the top over 0.5 .. 2.9 s; current block gold, lit blocks jade
        float litf = (t - 0.5f) / 2.4f;
        litf = litf < 0 ? 0 : (litf > 1 ? 1 : litf);
        float lit = litf * 20.0f;
        for (int i = 0; i < 20; i++) {
          float rad = (-90.0f + i * 18.0f) * 0.0174533f;
          int bx = (int) roundf(cx + 25.0f * cosf(rad)) - 1;
          int by = (int) roundf(cy + 25.0f * sinf(rad)) - 1;
          Color c = (i < (int) lit) ? C(77, 240, 160) : ((i == (int) lit && lit < 20.0f) ? C(242, 193, 78) : C(34, 56, 46));
          it.filled_rectangle(bx, by, 3, 3, c);
        }
        // eye socket ring (jade)
        for (int a = 0; a < 360; a += 3) {
          float rad = a * 0.0174533f;
          it.draw_pixel_at(cx + 14.0f * cosf(rad), cy + 14.0f * sinf(rad), C(77, 240, 160));
        }
        // eye: opens 2.9-3.3 s, blink 3.9-4.2 s, glance left/right 3.3-3.9 s
        float open = (t - 2.9f) / 0.4f;
        open = open < 0 ? 0 : (open > 1 ? 1 : open);
        if (t > 3.9f && t < 4.2f) open *= fabsf(cosf((t - 3.9f) / 0.3f * 3.14159f));
        if (open > 0.02f) {
          float hh = 8.0f * open;
          float gx = (t > 3.3f && t < 3.9f) ? 3.0f * sinf((t - 3.3f) * 10.5f) : 0.0f;
          for (int dy = -9; dy <= 9; dy++) {
            for (int dx = -11; dx <= 11; dx++) {
              float lens = hh * sqrtf(fmaxf(0.0f, 1.0f - (dx * dx) / 121.0f));
              if (fabsf((float) dy) > lens) continue;
              float ddx = dx - gx;
              Color c = C(233, 242, 236);
              if (ddx * ddx + dy * dy <= 20.0f) c = C(46, 196, 182);   // iris (turquoise)
              if (ddx * ddx + dy * dy <= 6.0f) c = C(5, 7, 6);         // pupil
              it.draw_pixel_at((int) cx + dx, (int) cy + dy, c);
            }
          }
        }
        return;
      }

      // ============ MAIN: rain + clock ============
      const std::string mode = id(display_mode).current_option();
      const bool show_rain = (mode != "Clock Only");
      const bool show_clock = (mode != "Rain Only");

      if (show_rain) {
        static bool init = false;
        static float head[64], spd[64];
        static uint8_t len[64];
        static bool act[64];
        static uint32_t last = 0;
        const float density = id(rain_density).state / 100.0f;
        const int trail = (int) id(rain_trail).state;
        auto respawn = [&](int x, bool first) {
          head[x] = first ? -(float) (random_uint32() % 64) : -(float) (random_uint32() % 24);
          spd[x] = 10.0f + random_float() * 26.0f;                      // rows per second
          len[x] = (uint8_t) (trail * (0.6f + 0.8f * random_float()));
          if (len[x] < 3) len[x] = 3;
          act[x] = random_float() < density;
        };
        if (!init) {
          for (int x = 0; x < W; x++) respawn(x, true);
          init = true;
          last = now_ms;
        }
        float dt = (now_ms - last) / 1000.0f;
        if (dt > 0.2f) dt = 0.2f;
        last = now_ms;

        const std::string rc = id(rain_color).current_option();
        const float scale = show_clock ? 0.45f : 1.0f;   // dim the rain behind the digits
        for (int x = 0; x < W; x++) {
          head[x] += spd[x] * id(rain_speed).state * dt;
          if (head[x] - len[x] > H) respawn(x, false);
          if (!act[x]) continue;
          int hy = (int) head[x];
          for (int i = 0; i < len[x]; i++) {
            int y = hy - i;
            if (y < 0 || y >= H) continue;
            float fd = 1.0f - (float) i / len[x];
            fd = fd * fd * scale;
            int r, g, b;
            if (rc == "Rainbow") {
              Color h = hue(x * 360.0f / W + now_ms / 30.0f); r = h.r; g = h.g; b = h.b;
            } else if (rc == "Matrix Green") { r = 0; g = 255; b = 70; }
            else if (rc == "Cyan") { r = 0; g = 220; b = 255; }
            else if (rc == "Amber") { r = 255; g = 150; b = 0; }
            else if (rc == "Purple") { r = 170; g = 60; b = 255; }
            else if (rc == "Red") { r = 255; g = 30; b = 30; }
            else { r = 255; g = 255; b = 255; }
            if (i == 0) {   // bright head, pushed toward white
              r = (r + 255) / 2; g = (g + 255) / 2; b = (b + 255) / 2; fd = scale;
            }
            it.draw_pixel_at(x, y, Color(r * fd, g * fd, b * fd));
          }
        }
      }

      if (show_clock) {
        static const uint8_t glyph[10][7] = {
          {0x0E,0x11,0x13,0x15,0x19,0x11,0x0E}, {0x04,0x0C,0x04,0x04,0x04,0x04,0x0E},
          {0x0E,0x11,0x01,0x02,0x04,0x08,0x1F}, {0x1E,0x01,0x01,0x0E,0x01,0x01,0x1E},
          {0x02,0x06,0x0A,0x12,0x1F,0x02,0x02}, {0x1F,0x10,0x1E,0x01,0x01,0x11,0x0E},
          {0x06,0x08,0x10,0x1E,0x11,0x11,0x0E}, {0x1F,0x01,0x02,0x04,0x08,0x08,0x08},
          {0x0E,0x11,0x11,0x0E,0x11,0x11,0x0E}, {0x0E,0x11,0x11,0x0F,0x01,0x02,0x0C}};
        const std::string cc = id(clock_color).current_option();
        Color col;
        if (cc == "Cyan") col = Color(0, 230, 255);
        else if (cc == "Matrix Green") col = Color(60, 255, 100);
        else if (cc == "Amber") col = Color(255, 160, 20);
        else if (cc == "Gold") col = Color(242, 193, 78);
        else if (cc == "Magenta") col = Color(255, 60, 220);
        else col = Color(255, 255, 255);

        const int S = 4;   // each font pixel = 4x4 panel pixels -> digit 20x28
        // draws one digit; outline pass first so digits stay legible over the rain
        auto digit = [&](int d, int x0, int y0) {
          for (int pass = 0; pass < 2; pass++)
            for (int r = 0; r < 7; r++)
              for (int c = 0; c < 5; c++)
                if (glyph[d][r] & (0x10 >> c)) {
                  if (pass == 0) it.filled_rectangle(x0 + c * S - 1, y0 + r * S - 1, S + 2, S + 2, Color(0, 0, 0));
                  else it.filled_rectangle(x0 + c * S, y0 + r * S, S, S, col);
                }
        };
        auto dashes = [&](int y0) {
          it.filled_rectangle(11 - 1, y0 + 12 - 1, 20 + 2, 4 + 2, Color(0, 0, 0));
          it.filled_rectangle(33 - 1, y0 + 12 - 1, 20 + 2, 4 + 2, Color(0, 0, 0));
          it.filled_rectangle(11, y0 + 12, 20, 4, col);
          it.filled_rectangle(33, y0 + 12, 20, 4, col);
        };

        auto t = id(local_time).now();
        if (!t.is_valid()) {
          dashes(2);
          dashes(34);
        } else {
          int h = t.hour;
          const bool pm = h >= 12;
          if (!id(clock_24h).state) { h = h % 12; if (h == 0) h = 12; }
          // hours on top row, minutes on bottom row (stacked = biggest possible digits on a square panel)
          if (h >= 10 || id(clock_24h).state) {
            digit(h / 10, 11, 2);
            digit(h % 10, 33, 2);
          } else {
            digit(h, 22, 2);        // 12-hour, single digit: centred
          }
          digit(t.minute / 10, 11, 34);
          digit(t.minute % 10, 33, 34);
          // seconds: 1px bar along the bottom edge
          int sw = (t.second * W) / 60 + 1;
          it.horizontal_line(0, H - 1, sw, Color(col.r / 2, col.g / 2, col.b / 2));
          // 12-hour mode: small PM marker top-right
          if (!id(clock_24h).state && pm) it.filled_rectangle(W - 5, 0, 4, 4, col);
        }
      }
